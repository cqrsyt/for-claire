<!DOCTYPE html>
<html lang="zh-Hans" data-lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="写给秋然 / For Claire — 四百多天 · Four Hundred Days" />
    <meta name="theme-color" content="#e8f0fa" />
    <title>写给秋然 · 四百多天 | For Claire</title>
    <!--
      Deploy note: all asset URLs below are relative, so the site works at
      domain root (Cloudflare Pages / custom domain) OR under /for-claire/
      (GitHub Pages project site). For photo paths in data/album.js, set
      window.SITE_CONFIG.basePath in js/config.js if assets break in a subpath.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Ma+Shan+Zheng&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=28" />
    <link rel="stylesheet" href="css/polish.css?v=28" />
    <link rel="stylesheet" href="css/motion.css?v=28" />
    <link rel="stylesheet" href="css/keepsake.css?v=28" />
    <link rel="stylesheet" href="css/book3d.css?v=28" />
  </head>
  <body class="locked">
    <div id="password-gate" class="password-gate" aria-hidden="false">
      <div class="password-card">
        <p class="password-kicker zh">写给秋然</p>
        <h1 class="password-title zh">请输入密码</h1>
        <p class="password-sub zh">写给大宝</p>
        <form id="password-form" class="password-form" autocomplete="off">
          <input type="password" id="password-input" class="password-input" placeholder="密码 / password" required />
          <button type="submit" class="password-btn zh">进入</button>
        </form>
        <p id="password-error" class="password-error" hidden>密码不对，再试一次</p>
        <p class="password-motifs" aria-hidden="true">🍅 🫑 🍆 · 🐶 · 🧸 · 🍁 · 🫐 🍊</p>
      </div>
    </div>
    <div id="ambient-petals" aria-hidden="true"></div>
    <div id="xuan-paper" aria-hidden="true"></div>
    <div id="claire-burst" aria-hidden="true"></div>
    <div id="app">
      <div class="masthead">
        <div class="masthead-lace" aria-hidden="true"></div>
        <div class="masthead-banner">
          <span class="masthead-icon masthead-icon--dog" title="金毛" aria-hidden="true">
            <svg viewBox="0 0 64 48" width="42" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="34" cy="28" rx="16" ry="12" fill="#e2b56a"/>
              <ellipse cx="18" cy="18" rx="8" ry="10" fill="#d4a24e"/>
              <ellipse cx="48" cy="18" rx="8" ry="10" fill="#d4a24e"/>
              <circle cx="30" cy="26" r="2.2" fill="#4a3f3a"/>
              <circle cx="40" cy="26" r="2.2" fill="#4a3f3a"/>
              <ellipse cx="35" cy="32" rx="3.2" ry="2.2" fill="#c9897b"/>
              <path d="M22 38c6 6 20 6 26 0" stroke="#c4893c" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <p class="masthead-kicker zh">大宝 · 小朋友 · 狗狗</p>
          <span class="masthead-icon masthead-icon--maple" title="枫叶" aria-hidden="true">🍁</span>
          <span class="masthead-icon masthead-icon--plush" title="毛绒" aria-hidden="true">🧸</span>
        </div>
        <header class="topbar">
        <div class="brand">
          <div id="brand-title" class="brand-title zh">写给秋然</div>
          <div id="brand-sub" class="brand-sub zh">四百多天</div>
        </div>
        <div class="topbar-actions">
          <nav id="nav-pills" class="nav-pills" aria-label="sections">
            <button type="button" data-view="cover" class="active">封面</button>
            <button type="button" data-view="story">我们的故事</button>
            <button type="button" data-view="album">相册</button>
          </nav>
          <div class="lang-toggle" role="group" aria-label="language">
            <button type="button" data-lang="zh" class="active">中文</button>
            <button type="button" data-lang="en">EN</button>
          </div>
        </div>
        </header>
        <div id="claire-likes" class="claire-likes" role="toolbar" aria-label="秋然喜欢的小东西">
          <button type="button" class="like-btn" data-like="tomato" title="番茄">🍅</button>
          <button type="button" class="like-btn" data-like="pepper" title="青椒">🫑</button>
          <button type="button" class="like-btn" data-like="eggplant" title="茄子">🍆</button>
          <button type="button" class="like-btn" data-like="fruit" title="水果">🍊</button>
          <button type="button" class="like-btn" data-like="berry" title="浆果">🫐</button>
          <button type="button" class="like-btn" data-like="dog" title="金毛">🐶</button>
          <button type="button" class="like-btn" data-like="plush" title="毛绒">🧸</button>
          <button type="button" class="like-btn" data-like="maple" title="枫叶">🍁</button>
          <button type="button" class="like-btn like-btn--blue" data-like="blue" title="蓝色">蓝</button>
        </div>
        <div class="masthead-lace masthead-lace--bottom" aria-hidden="true"></div>
      </div>

      <!-- Cover -->
      <section id="view-cover" class="view cover active" data-view="cover" aria-label="cover"></section>

      <!-- Our Story -->
      <section id="view-story" class="view story" data-view="story" aria-label="story"></section>

      <!-- Album -->
      <section id="view-album" class="view album" data-view="album" aria-label="album">
        <div id="chapter-header" class="chapter-header"></div>
        <div id="book-stage" class="book-stage">
          <div class="book-sketches" aria-hidden="true">
            <div class="book-sketch book-sketch--rose">
              <img src="img/sketches/rose-wellcome.jpg" alt="" />
            </div>
            <div class="book-sketch book-sketch--couple">
              <img src="img/sketches/couple-line.svg" alt="" />
            </div>
            <div class="book-sketch book-sketch--maple">
              <img src="img/sketches/maple.svg" alt="" />
            </div>
            <div class="book-sketch book-sketch--hands">
              <img src="img/sketches/hands-heart.svg" alt="" />
            </div>
          </div>
          <div class="book-3d" id="book-3d">
            <div class="book-3d-cover" aria-hidden="true">
              <img src="img/sketches/couple-1908.jpg" alt="" />
              <p class="book-3d-cover-title zh">写给秋然</p>
            </div>
            <div class="book-3d-spine" aria-hidden="true"></div>
            <div class="book-3d-block">
              <div class="book-3d-thickness"></div>
              <div id="book-page" class="book-page" aria-live="polite"></div>
              <div class="book-3d-foreedge"></div>
            </div>
          </div>
        </div>
        <p class="sketch-credit">
          左页素描：1908 年明信片（公有领域）· 玫瑰铅笔稿：Wellcome Collection（Public Domain Mark）
        </p>
        <p id="swipe-hint" class="swipe-hint"></p>
      </section>

      <footer id="site-footer" class="site-footer"></footer>
    </div>

    <!-- Album page controls (fixed) -->
    <div id="album-controls" class="album-controls" style="display: none" aria-hidden="false">
      <div class="album-controls-inner">
        <button type="button" id="btn-toc" class="ctrl-btn ctrl-btn--text" aria-label="目录">目录</button>
        <button type="button" id="btn-first" class="ctrl-btn" aria-label="第一页">‹‹</button>
        <button type="button" id="btn-prev" class="ctrl-btn" aria-label="Previous">‹</button>
        <div id="page-indicator" class="page-indicator"></div>
        <button type="button" id="btn-next" class="ctrl-btn" aria-label="Next">›</button>
        <button type="button" id="btn-last" class="ctrl-btn" aria-label="最后一页">››</button>
        <button type="button" id="btn-random" class="ctrl-btn ctrl-btn--text" aria-label="随机一页">随机</button>
      </div>
    </div>

    <div id="chapter-drawer" class="chapter-drawer" hidden>
      <div class="chapter-drawer-card">
        <h2 class="chapter-drawer-title zh">目录</h2>
        <p class="chapter-drawer-sub">点一章，就翻到那里</p>
        <div id="chapter-drawer-list" class="chapter-drawer-list"></div>
        <button type="button" id="chapter-drawer-close" class="cover-open zh">收起</button>
      </div>
    </div>
    <div id="claire-toast" class="claire-toast" hidden></div>

    <div id="birthday-egg" class="birthday-egg" hidden role="dialog" aria-label="生日快乐">
      <div class="birthday-egg-hearts" aria-hidden="true"></div>
      <div class="birthday-egg-card">
        <p class="birthday-egg-text zh">生日快乐</p>
        <p class="birthday-egg-sub zh">大宝，第九页走到第二十二页</p>
      </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
      <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close">×</button>
      <div class="lightbox-inner">
        <div id="lightbox-frame" class="lightbox-frame"></div>
        <p id="lightbox-caption" class="lightbox-caption"></p>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="data/album.js?v=28"></script>
    <script src="js/app.js?v=28"></script>
    <script src="js/petals.js?v=28"></script>
    <script src="js/keepsake.js?v=28"></script>
    <script src="js/pageturn.js?v=28"></script>
  </body>
</html>
