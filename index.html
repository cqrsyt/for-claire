    <div id="password-gate" class="password-gate" aria-hidden="false">
      <div class="password-card">
        <p class="password-kicker zh">写给秋然</p>
        <h1 class="password-title zh">请输入密码</h1>
        <p class="password-sub en">A small key for a private keepsake</p>
        <form id="password-form" class="password-form" autocomplete="off">
          <input type="password" id="password-input" class="password-input" placeholder="密码 / password" required />
          <button type="submit" class="password-btn zh">进入</button>
        </form>
        <p id="password-error" class="password-error" hidden>密码不对，再试一次</p>
      </div>
    </div>
    <div id="ambient-petals" aria-hidden="true"></div>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <div id="brand-title" class="brand-title zh">写给秋然</div>
          <div id="brand-sub" class="brand-sub zh">四百多天</div>
        </div>
        <div class="topbar-actions">
          <nav id="nav-pills" class="nav-pills" aria-label="sections">
            <button type="button" data-view="cover" class="active">封面</button>
            <button type="button" data-view="story">我们的故事</button>
            <button type="button" data-view="album">相册</button>
          </nav>
          <div class="lang-toggle" role="group" aria-label="language">
            <button type="button" data-lang="zh" class="active">中文</button>
            <button type="button" data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <!-- Cover -->
      <section id="view-cover" class="view cover active" data-view="cover" aria-label="cover"></section>

      <!-- Our Story -->
      <section id="view-story" class="view story" data-view="story" aria-label="story"></section>

      <!-- Album -->
      <section id="view-album" class="view album" data-view="album" aria-label="album">
        <div id="chapter-header" class="chapter-header"></div>
        <div id="book-stage" class="book-stage">
          <div id="book-page" class="book-page" aria-live="polite"></div>
        </div>
        <p id="swipe-hint" class="swipe-hint"></p>
      </section>

      <footer id="site-footer" class="site-footer"></footer>
    </div>

    <!-- Album page controls (fixed) -->
    <div id="album-controls" class="album-controls" style="display: none" aria-hidden="false">
      <div class="album-controls-inner">
        <button type="button" id="btn-prev" class="ctrl-btn" aria-label="Previous">‹</button>
        <div id="page-indicator" class="page-indicator"></div>
        <button type="button" id="btn-next" class="ctrl-btn" aria-label="Next">›</button>
      </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
      <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close">×</button>
      <div class="lightbox-inner">
        <div id="lightbox-frame" class="lightbox-frame"></div>
        <p id="lightbox-caption" class="lightbox-caption"></p>
      </div>
    </div>
